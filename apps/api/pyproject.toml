[project]
name = "api"
version = "0.1.0"
description = "DocChat API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
